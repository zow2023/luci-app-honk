<style>
.honk-dashboard{max-width:760px;margin:0 auto;padding:8px 0 24px;color:#f5f5f5}.honk-dashboard *{box-sizing:border-box}.honk-tabs{display:flex;gap:34px;border-bottom:1px solid #444;margin-bottom:26px}.honk-tab{color:#aaa;text-decoration:none;font-size:21px;font-weight:700;padding:0 22px 14px}.honk-tab.active{color:#65d875;border-bottom:4px solid #65d875}.honk-dashboard h1{display:inline-block;margin:0 12px 6px 0;color:#fafafa;font-size:38px;line-height:1.1}.honk-badge{display:inline-block;padding:8px 16px;border-radius:24px;background:#173e2c;color:#65d875;font-size:19px;font-weight:700;vertical-align:6px}.honk-dot{display:inline-block;width:13px;height:13px;margin-right:8px;border-radius:50%;background:currentColor}.honk-description{margin:0 0 42px;color:#aaa;font-size:20px;font-weight:600}.honk-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}.honk-card{min-height:138px;padding:28px 30px;border:1px solid #505050;border-radius:12px;background:#333;box-shadow:0 2px 5px rgba(0,0,0,.18)}.honk-card:last-child{grid-column:1/2}.honk-label{color:#bbb;font-size:20px;font-weight:700}.honk-label .icon{color:#bbb;margin-right:10px}.honk-value{margin-top:18px;color:#65d875;font-size:25px;font-weight:800}.honk-card.version .honk-value{color:#f5f5f5;font-size:20px}.honk-dashboard hr{border:0;border-top:1px solid #494949;margin:30px 0 34px}.honk-dashboard h2{margin:0 0 20px;color:#bbb;font-size:20px}.honk-service{display:flex;align-items:center;gap:16px;margin-bottom:35px;font-size:24px;font-weight:700}.honk-switch{position:relative;width:74px;height:40px;border:0;border-radius:25px;background:#555;cursor:pointer}.honk-switch.on{background:#20bd68}.honk-switch:after{content:'';position:absolute;top:5px;left:5px;width:30px;height:30px;border-radius:50%;background:#fff;transition:left .18s}.honk-switch.on:after{left:39px}.honk-actions{display:flex;flex-wrap:wrap;gap:16px}.honk-action{min-width:165px;padding:13px 25px;border:2px solid;border-radius:9px;background:transparent;font-size:22px;font-weight:700;cursor:pointer}.start{color:#20a965;border-color:#20a965}.restart{color:#2996d5;border-color:#2996d5}.stop{color:#e04d49;border-color:#e04d49}.panel{color:#a247c7;border-color:#a247c7}.honk-error{color:#ed6a63;font-size:15px;margin-top:14px}@media(max-width:600px){.honk-cards{grid-template-columns:1fr}.honk-card:last-child{grid-column:auto}.honk-tabs{gap:4px}.honk-tab{padding-left:10px;padding-right:10px}}
</style>
<div class="honk-dashboard">
<nav class="honk-tabs"><a class="honk-tab active" href="<%=url('admin/services/honk')%>"><%:控制%></a><a class="honk-tab" href="<%=url('admin/services/honk/global')%>"><%:配置%></a><a class="honk-tab" href="<%=url('admin/services/honk/log')%>"><%:日志%></a></nav>
<div><h1>Horse</h1><span id="honk_badge" class="honk-badge"><span class="honk-dot"></span><%:加载中%></span></div>
<p class="honk-description"><%:基于 Rust eBPF 的高性能透明代理解决方案 (honk 引擎) 。%></p>
<section class="honk-cards"><div class="honk-card"><div class="honk-label"><span class="icon">▣</span><%:内存占用%></div><div id="honk_memory" class="honk-value">--</div></div><div class="honk-card"><div class="honk-label"><span class="icon">◷</span><%:运行时间%></div><div id="honk_uptime" class="honk-value">--</div></div><div class="honk-card version"><div class="honk-label"><span class="icon">◈</span><%:引擎版本%></div><div id="honk_version" class="honk-value">--</div></div></section>
<hr/><section><h2><%:服务%></h2><div class="honk-service"><button id="honk_autostart" class="honk-switch" type="button" aria-label="<%:开机自启%>"></button><span><%:开机自启%></span></div></section>
<section><h2><%:状态控制%></h2><div class="honk-actions"><button class="honk-action start" type="button" onclick="honkAction('start')">▶ <%:启动%></button><button class="honk-action restart" type="button" onclick="honkAction('restart')">↻ <%:重启%></button><button class="honk-action stop" type="button" onclick="honkAction('stop')">■ <%:停止%></button><button class="honk-action panel" type="button" onclick="location.href='<%=url('admin/services/honk/global')%>'">▦ <%:面板%></button></div><div id="honk_error" class="honk-error"></div></section>
</div>
<script type="text/javascript">//<![CDATA[
function honkAction(action){XHR.get('<%=url("admin/services/honk/service_action")%>',{action:action},function(x){if(!x||x.status!==200)document.getElementById('honk_error').textContent='<%:操作失败，请查看日志%>';});}
function honkRender(data){var b=document.getElementById('honk_badge');b.innerHTML='<span class="honk-dot"></span>'+(data.running?'<%:运行中%>':'<%:未运行%>');b.style.background=data.running?'#173e2c':'#4a2525';b.style.color=data.running?'#65d875':'#ed6a63';document.getElementById('honk_memory').textContent=data.memory||'--';document.getElementById('honk_uptime').textContent=data.uptime||'--';document.getElementById('honk_version').textContent=data.version||'0.0.1-alpha';var s=document.getElementById('honk_autostart');s.className='honk-switch'+(data.autostart?' on':'');s.onclick=function(){XHR.get('<%=url("admin/services/honk/service_action")%>',{action:'autostart',value:data.autostart?'0':'1'},function(){});};}
XHR.poll(3,'<%=url("admin/services/honk/status")%>',null,function(x,data){if(data)honkRender(data);});
//]]></script>
