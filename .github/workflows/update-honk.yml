name: Update honk version

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    name: Update honk core version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve latest official debug tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          # 官方 daeuniverse/honk 的 debug 发布形如 debug.2026.10.21.1，
          # 均为 prerelease（releases/latest 端点拿不到），故必须用列表端点。
          # 正则只认 debug.YYYY.MM.DD.N，排除 v* 正式版与 draft。
          TAG="$(
            gh release list --repo daeuniverse/honk --limit 50 \
              --json tagName,isDraft \
              --jq '.[] | select(.isDraft == false) | .tagName' \
            | grep -m1 -E '^debug\.[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$' \
            || true
          )"

          if [ -z "$TAG" ]; then
            echo "ERROR: no debug.YYYY.MM.DD.N tag found in recent releases" >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved official debug tag: ${TAG}"

      - name: Update honk version
        env:
          HONK_TAG_OVERRIDE: ${{ steps.resolve.outputs.tag }}
        run: bash scripts/update_honk_version.sh

      - name: Sanity check tag in Makefile
        run: |
          TAG="$(grep '^HONK_RELEASE_TAG:=' honk/Makefile | cut -d= -f2)"
          echo "Makefile tag: ${TAG}"

          if ! printf '%s\n' "${TAG}" \
              | grep -qE '^debug\.[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'; then
            echo "ERROR: unexpected tag format in Makefile: ${TAG}" >&2
            echo "Expecting debug.YYYY.MM.DD.N from daeuniverse/honk." >&2
            exit 1
          fi
          echo "OK: official debug tag"

      - name: Commit changes
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version change."
          else
            TAG="$(grep '^HONK_RELEASE_TAG:=' honk/Makefile | cut -d= -f2)"

            git add honk/Makefile
            git commit -m "honk: update to ${TAG}"

            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: master

      #- name: Trigger build packages
      #  env:
      #    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
     #   run: |
      #    gh workflow run "Build packages" --ref master
