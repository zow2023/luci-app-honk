name: Update honk version

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# API 变体偏好顺序: 逐个尝试, 取两个架构上都存在的第一个。
# 默认 -native-api (最小体积, OpenWrt 网关推荐)。
# 若 luci/面板依赖 Clash API, 改为: "full native-api clash-api"。
env:
  UPSTREAM_REPO: daeuniverse/honk
  MAKEFILE: honk/Makefile
  SCRIPT: scripts/update_honk_version.sh
  BRANCH: master
  HONK_VARIANT_PREFERENCE: 'clash-api'
  DOONA_DIR: luci-app-honk/root/etc/honk/doona   # ← 新增：doona 面板嵌入目录

concurrency:
  group: update-honk-version
  cancel-in-progress: false

jobs:
  update:
    name: Update honk core version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # 1. 解析上游最新 tag
      - name: Resolve latest official tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_RE='^(debug\.[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+|v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+|v[0-9]+\.[0-9]+\.[0-9]+\.beta\.[0-9]+)$'
          TAG="$(gh release list --repo "$UPSTREAM_REPO" --limit 100 \
                   --json tagName,isDraft \
                   --jq '.[] | select(.isDraft == false) | .tagName' \
                 | grep -E "$TAG_RE" | head -n1)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved official tag: ${TAG}"

      # 2. 探测资产段并写回 Makefile
      - name: Detect asset segments and patch Makefile
        id: segments
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          T_X86="x86_64-unknown-linux-musl"
          T_ARM="aarch64-unknown-linux-musl"
          BASE="honk-core-${TAG}"

          ASSETS="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${TAG}" --jq '.assets[].name')"

          read -r -a VARIANTS <<< "$HONK_VARIANT_PREFERENCE"

          pick() {
            local t="$1" alloc var name pat
            for alloc in "-stock" ""; do
              for v in "${VARIANTS[@]}"; do
                var=""
                [ -n "$v" ] && var="-${v}"
                pat="^${BASE}-${t}${alloc}${var}\.tar\.gz$"
                name="$(grep -E "$pat" <<<"$ASSETS" | head -n1 || true)"
                if [ -n "$name" ]; then printf '%s\n' "$name"; return 0; fi
              done
            done
            return 1
          }

          split_segments() {
            local name="$1" t="$2" rest
            rest="${name%.tar.gz}"
            rest="${rest#"${BASE}-${t}"}"
            if [[ "$rest" == -stock* ]]; then
              printf '%s %s\n' "-stock" "${rest#-stock}"
            else
              printf '%s %s\n' "" "$rest"
            fi
          }

          A_X86="$(pick "$T_X86")" || { echo "ERROR: no x86_64 asset for ${TAG}" >&2; exit 1; }
          A_ARM="$(pick "$T_ARM")" || { echo "ERROR: no aarch64 asset for ${TAG}" >&2; exit 1; }

          read -r SUF_X86 VAR_X86 <<< "$(split_segments "$A_X86" "$T_X86")"
          read -r SUF_ARM VAR_ARM <<< "$(split_segments "$A_ARM" "$T_ARM")"
          [ "$SUF_X86" = "$SUF_ARM" ] && [ "$VAR_X86" = "$VAR_ARM" ] || {
            echo "ERROR: segment mismatch" >&2; exit 1;
          }

          sed -i "s|^HONK_SUFFIX:=.*|HONK_SUFFIX:=${SUF_X86}|"    "$MAKEFILE"
          sed -i "s|^HONK_VARIANT:=.*|HONK_VARIANT:=${VAR_X86}|"  "$MAKEFILE"

          echo "suffix=${SUF_X86}"   >> "$GITHUB_OUTPUT"
          echo "variant=${VAR_X86}"  >> "$GITHUB_OUTPUT"

      # 3. 运行 honk 版本更新脚本
      - name: Run update script
        env:
          HONK_TAG_OVERRIDE: ${{ steps.resolve.outputs.tag }}
        run: bash "$SCRIPT"

      # 4. 校验 Makefile
      - name: Sanity check
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          EXPECTED_SUFFIX: ${{ steps.segments.outputs.suffix }}
          EXPECTED_VARIANT: ${{ steps.segments.outputs.variant }}
        run: |
          set -euo pipefail
          strip() { sed -E 's/[#].*$//' | tr -d '[:space:]'; }
          M_TAG="$(grep '^HONK_RELEASE_TAG:=' "$MAKEFILE" | head -n1 | cut -d= -f2-)"
          M_SUF="$(grep '^HONK_SUFFIX:='  "$MAKEFILE" | head -n1 | cut -d= -f2- | strip)"
          M_VAR="$(grep '^HONK_VARIANT:=' "$MAKEFILE" | head -n1 | cut -d= -f2- | strip)"
          [ "$M_TAG" = "$TAG" ] \
            || { echo "ERROR: Makefile tag mismatch" >&2; exit 1; }
          [ "$M_SUF" = "$EXPECTED_SUFFIX" ] \
            || { echo "ERROR: HONK_SUFFIX mismatch" >&2; exit 1; }
          [ "$M_VAR" = "$EXPECTED_VARIANT" ] \
            || { echo "ERROR: HONK_VARIANT mismatch" >&2; exit 1; }
          echo "OK: tag=${M_TAG} suffix='${M_SUF}' variant='${M_VAR}'"

      # ★ 新增步骤：嵌入 Doona 面板
      - name: Update doona dashboard
        run: bash scripts/update_doona.sh

      # 5. 提交（★ 修改：git add 同时覆盖 Makefile 和 doona 目录）
      - name: Commit changes
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version change."
          else
            git add "$MAKEFILE" "$DOONA_DIR"
            git commit -m "honk: update to ${{ steps.resolve.outputs.tag }}; sync doona dashboard"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Committed update to ${{ steps.resolve.outputs.tag }}"
          fi

      # 6. 原生 git push（保持不变）
      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${BRANCH}"
